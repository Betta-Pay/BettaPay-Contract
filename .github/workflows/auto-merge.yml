# Auto-merge queue ONLY.
#
# This workflow does NOT run tests. Quality gates live in tests.yml, clippy.yml
# and security.yml and are enforced as required status checks via branch
# protection on main. When a PR is queued below, GitHub itself refuses to merge
# until every required check and every review requirement is green.
#
# Any PR from an external fork is skipped: queueing is for first-party branches.

name: Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Queue for auto-merge
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Enable native auto-merge (GitHub merges when all required checks pass)
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.graphql(
                `mutation($id: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) {
                    pullRequest {
                      number
                      autoMergeRequest { enabledAt }
                    }
                  }
                }`,
                { id: context.payload.pull_request.node_id },
              );
              core.info(
                `PR #${context.payload.pull_request.number} queued for auto-merge. ` +
                'GitHub will merge it only after every required status check and review rule passes.',
              );
            } catch (err) {
              const msg = err instanceof Error ? err.message : String(err);
              // Benign states: already queued, waiting on requirements, blocked
              // by a rule, or the PR was closed in the meantime.
              core.notice(`Auto-merge not queued for PR #${context.payload.pull_request.number}: ${msg}`);
            }
