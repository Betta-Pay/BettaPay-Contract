[advisories]
version = 2
# Grandfathered advisory baseline (do NOT add new entries casually):
# - RUSTSEC-2026-0387: crypto-bigint 0.5.5 timing variability; comes in
#   transitively through soroban-sdk 21.7.x — clears on the next soroban upgrade.
# - RUSTSEC-2024-0436: paste is unmaintained, no impact on correctness.
ignore = ["RUSTSEC-2026-0387", "RUSTSEC-2024-0436"]

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
